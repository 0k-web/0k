name: Continuous Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds repo
        uses: actions/checkout@v4
        with:
          repository: abndnce/b0k
          token: ${{ secrets.BUILDS_PAT }}
          path: builds-repo

      - name: Checkout relay repo
        uses: actions/checkout@v4
        with:
          repository: abndnce/relay
          token: ${{ secrets.RELAY_PAT }}
          path: relay-repo

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build jsDelivr SVG
        run: ZERO_K_CDN=jsdelivr ZERO_K_DEFAULT_GITHUB_BEHAVIOR=jsdelivr ZERO_K_INDEX_FORMAT=svg pnpm build
      - name: Copy jsDelivr SVG
        run: |
          mkdir -p builds-repo/jsdelivr
          cp apps/web/dist/index.svg builds-repo/jsdelivr/index.svg
          cp apps/web/dist/sw.js builds-repo/jsdelivr/sw.js

      - name: Build esm.sh HTML
        run: ZERO_K_CDN=esmsh ZERO_K_DEFAULT_GITHUB_BEHAVIOR=githubusercontent ZERO_K_INDEX_FORMAT=html pnpm build
      - name: Copy esm.sh HTML
        run: |
          mkdir -p builds-repo/esm.sh
          cp apps/web/dist/index.html builds-repo/esm.sh/index.html
          cp apps/web/dist/sw.js builds-repo/esm.sh/sw.js

      - name: Build Statically SVG
        run: ZERO_K_CDN=statically ZERO_K_DEFAULT_GITHUB_BEHAVIOR=statically ZERO_K_INDEX_FORMAT=svg pnpm build
      - name: Copy Statically SVG
        run: |
          mkdir -p builds-repo/statically
          cp apps/web/dist/index.svg builds-repo/statically/index.svg
          cp apps/web/dist/sw.js builds-repo/statically/sw.js

      - name: Push builds repo
        working-directory: builds-repo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jsdelivr/index.svg jsdelivr/sw.js esm.sh/index.html esm.sh/sw.js statically/index.svg statically/sw.js
          if git diff --cached --quiet; then
            echo "No published build changes"
            exit 0
          fi
          git commit -m "Update published builds for ${GITHUB_SHA}"
          git push

      - name: Build relay
        run: pnpm --filter "@0k-web/relay" build
      - name: Push relay repo
        working-directory: relay-repo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf ./*
          cp -r ../apps/relay/dist/* ./
          git add -A
          if git diff --cached --quiet; then
            echo "No relay build changes"
            exit 0
          fi
          git commit -m "Update relay for ${GITHUB_SHA}"
          git push

      - name: Build selfhost-0k.zip
        run: ZERO_K_CDN=jsdelivr ZERO_K_DEFAULT_GITHUB_BEHAVIOR=jsdelivr pnpm build
      - name: Zip selfhost-0k.zip
        working-directory: apps/web/dist
        run: zip -r ../../../selfhost-0k.zip .

      - name: Build selfhost-0k-assets-esmsh.zip
        run: ZERO_K_CDN=esmsh ZERO_K_DEFAULT_GITHUB_BEHAVIOR=githubusercontent pnpm build
      - name: Zip selfhost-0k-assets-esmsh.zip
        working-directory: apps/web/dist
        run: zip -r ../../../selfhost-0k-assets-esmsh.zip .

      - name: Build selfhost-0k-assets-statically.zip
        run: ZERO_K_CDN=statically ZERO_K_DEFAULT_GITHUB_BEHAVIOR=statically pnpm build
      - name: Zip selfhost-0k-assets-statically.zip
        working-directory: apps/web/dist
        run: zip -r ../../../selfhost-0k-assets-statically.zip .

      - name: Build selfhost-0k-assets-colocated.zip
        run: pnpm build
      - name: Zip selfhost-0k-assets-colocated.zip
        working-directory: apps/web/dist
        run: zip -r ../../../selfhost-0k-assets-colocated.zip .

      - name: Build for IPFS
        run: ZERO_K_DEFAULT_GITHUB_BEHAVIOR=githubusercontent ZERO_K_INDEX_FORMAT=html pnpm build
      - name: Upload to IPFS
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          node --input-type=module -e "
            import { readFileSync, readdirSync, writeFileSync } from 'fs';
            import { join, relative } from 'path';
            const files = [];
            function walk(dir) {
              for (const e of readdirSync(dir, { withFileTypes: true })) {
                const p = join(dir, e.name);
                if (e.isDirectory()) walk(p); else files.push(p);
              }
            }
            walk('apps/web/dist');
            const form = new FormData();
            const folder = \`deploy-\${new Date().toISOString()}/\`;
            for (const f of files) {
              form.append('file', new Blob([readFileSync(f)]), folder + relative('apps/web/dist', f));
            }
            form.append('pinataMetadata', JSON.stringify({ name: 'deploy-' + Date.now() }));
            form.append('pinataOptions', JSON.stringify({ cidVersion: 1 }));
            const res = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + process.env.PINATA_JWT },
              body: form,
            });
            const json = await res.json();
            if (!json.IpfsHash) {
              console.error('Pinata response:', JSON.stringify(json));
              process.exit(1);
            }
            writeFileSync('/tmp/cid', json.IpfsHash);
          "
      - name: Point IPNS
        env:
          IPNS_KEY: ${{ secrets.IPNS_KEY }}
        run: npx point-ipns $(cat /tmp/cid)

      - name: Compile server
        working-directory: apps/server
        run: pnpm compile
      - name: Copy compiled server
        run: cp /tmp/tunnel-0k-linux-arm64 /tmp/tunnel-0k-linux-x64 /tmp/tunnel-0k-mac-arm64 /tmp/tunnel-0k-mac-x64 /tmp/tunnel-0k-windows-x64.exe .

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            selfhost-0k.zip
            selfhost-0k-assets-esmsh.zip
            selfhost-0k-assets-statically.zip
            selfhost-0k-assets-colocated.zip
            tunnel-0k-linux-arm64
            tunnel-0k-linux-x64
            tunnel-0k-mac-arm64
            tunnel-0k-mac-x64
            tunnel-0k-windows-x64.exe
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          gh release delete "$TAG" -y || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"

          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "$TAG" \
            selfhost-0k.zip \
            selfhost-0k-assets-esmsh.zip \
            selfhost-0k-assets-statically.zip \
            selfhost-0k-assets-colocated.zip \
            tunnel-0k-linux-arm64 \
            tunnel-0k-linux-x64 \
            tunnel-0k-mac-arm64 \
            tunnel-0k-mac-x64 \
            tunnel-0k-windows-x64.exe
      - name: Purge jsDelivr cache
        run: |
          curl "https://purge.jsdelivr.net/gh/abndnce/b0k@main/jsdelivr/index.svg"
          curl "https://purge.jsdelivr.net/gh/abndnce/b0k@main/jsdelivr/sw.js"
