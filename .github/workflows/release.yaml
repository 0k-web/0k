name: Continuous Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Zip artifacts
        run: cd dist && zip -r ../0k.zip .

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"
          gh release create "$TAG" \
            --title "latest" \
            --latest \
            --notes-file .github/latest-release-notes.md
